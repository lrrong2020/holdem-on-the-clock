name: Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:webkit
      - name: Play against the bundled Kernel
        run: |
          node scripts/kernel.mjs &
          kernel_pid=$!
          trap 'kill "$kernel_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:4180/api/address > /dev/null
          npm run test:kernel
          npm run test:kernel -- webkit
